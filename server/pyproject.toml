# -------------------------------------------------
# Project Metadata (PEP 621)
# Defines package metadata used for packaging,
# publishing, and dependency management.
# -------------------------------------------------
[project]
name = "Juris-AI"
version = "0.1.0"
description = "Juris AI is a modern backend service for AI-powered legal assistance."
authors = [{ name = "Bharat Kumar", email = "kumar.bhart28@gmail.com" }]
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]
keywords = ["LangChain", "Legal", "AI", "FastAPI", "groq", "LangSmith", "Agent"]


# -------------------------------------------------
# Poetry Configuration
# Poetry-specific settings that control how the
# project is managed and packaged.
# -------------------------------------------------
[tool.poetry]
package-mode = false


# -------------------------------------------------
# Poetry Package Sources
# -------------------------------------------------
# PyTorch CPU wheels are used for the default
# CPU-based application/container environment.
#
# GPU deployments can use a separate environment/image
# with the appropriate CUDA-enabled PyTorch distribution.
# -------------------------------------------------
[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


# -------------------------------------------------
# Runtime Dependencies
# Packages required to run the application.
# -------------------------------------------------
[tool.poetry.dependencies]

# Web API framework and ASGI server
fastapi = "^0.116.0"
uvicorn = { extras = ["standard"], version = "^0.31.1" }

# Authentication and password hashing
pwdlib = { extras = ["argon2"], version = "^0.3.0" }
python-jose = "^3.5.0"

# Multipart form/file uploads
python-multipart = "^0.0.31"

# Data validation and application configuration
pydantic = { version = "^2.7.1", extras = ["email"] }
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"

# Database ORM and PostgreSQL driver
sqlalchemy = "^2.0.29"
psycopg = { version = "^3.1.19", extras = ["binary"] }
asyncpg = "^0.31.0"

# Database schema migrations
alembic = "^1.13.1"

# PDF parsing and text extraction
pypdf = "^6.15.0"
python-docx = "^1.2.0"
# HTML parsing (rag/ingestion/parsers/file.py's _parse_html) -- was
# previously present only as an untracked/incidental install, not a
# declared dependency; discovered and fixed while resolving an
# unrelated ragas/langchain-community conflict (`poetry install --sync`
# correctly removed it as untracked, which is what surfaced the gap).
beautifulsoup4 = "^4.12.3"

# -------------------------------------------------
# Embeddings / Vector Search
# -------------------------------------------------
pgvector = ">=0.3,<1.0"

# Embedding model:
# BAAI/bge-small-en-v1.5
#
# sentence-transformers depends on PyTorch.
# Explicitly use the CPU PyTorch distribution for the
# default application environment.
sentence-transformers = "5.1.2"
torch = { version = "*", source = "pytorch-cpu" }

# Token counting for prompt budgeting (agentic/agents/prompts/token_budget.py).
# Not an exact tokenizer for the Llama/Qwen models actually in use --
# see that module's docstring for why cl100k_base is the best available
# approximation without a gated per-model tokenizer download.
tiktoken = "^0.14.0"

# -------------------------------------------------
# Output Guardrails / PII Detection
#
# agentic/guardrails/pii.py -- NER-based PII detection needs a real
# entity recognizer, not regex, which is what presidio-analyzer's
# spaCy-backed AnalyzerEngine provides; presidio-anonymizer applies
# the redaction. en-core-web-sm (not the default, larger
# en_core_web_lg) keeps this addition small relative to the
# torch/sentence-transformers stack already installed for embeddings
# -- see pii.py's module docstring for the full design reasoning.
# spaCy models aren't published to PyPI, hence the direct wheel URL
# (the same artifact `python -m spacy download en_core_web_sm`
# installs).
# -------------------------------------------------
# Same pattern as aws-sam-cli below: requires-python's declared upper
# bound (<4.0) is looser than presidio-anonymizer's own (<3.15,
# Python 3.15 not yet released at time of writing) -- an explicit
# python= marker here, not a raised project floor/lowered ceiling.
presidio-analyzer = { version = "^2.2.364", python = ">=3.11,<3.15" }
presidio-anonymizer = { version = "^2.2.364", python = ">=3.11,<3.15" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl", python = ">=3.11,<3.15" }

# ONNX runtime for CPU inference
onnxruntime = "^1.22"
# Required by sentence-transformers when CrossEncoder uses backend="onnx".
optimum = { extras = ["onnxruntime"], version = "1.23.3" }

# -------------------------------------------------
# Large Language Model Providers
# -------------------------------------------------
groq = "^1.5.0"
ollama = "^0.6.2"

# -------------------------------------------------
# MCP
# -------------------------------------------------
mcp = { extras = ["cli"], version = "^2.1.0" }

# -------------------------------------------------
# Optional LLM Provider SDKs
# -------------------------------------------------
# openai = "^1.30.1"
# anthropic = "^0.28.0"

# -------------------------------------------------
# Agent / Workflow Orchestration
# -------------------------------------------------
langgraph = "^1.2.9"
langgraph-checkpoint-postgres = "^3.0.0"
scikit-learn = "^1.9.0"

# -------------------------------------------------
# Optional Cache Backend
# Used only when CACHE_BACKEND=redis.
# -------------------------------------------------
redis = "^5.0.4"

# -------------------------------------------------
# Async Utilities and HTTP Client
# -------------------------------------------------
aiofiles = "^23.2.1"
httpx = { extras = ["http2"], version = "^0.28.1" }
trafilatura = "^2.0.0"

# -------------------------------------------------
# Optional AWS SDK
# Required only when using S3 as the storage backend.
# -------------------------------------------------
boto3 = "^1.34.101"

# -------------------------------------------------
# Observability
# -------------------------------------------------
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-exporter-otlp-proto-http = "^1.44.0"
opentelemetry-exporter-otlp = "^1.44.0"
opentelemetry-instrumentation-fastapi = "^0.65b0"
langsmith = "^0.10.17"


# -------------------------------------------------
# Evaluation Dependencies
# -------------------------------------------------
[tool.poetry.group.eval.dependencies]
# Pinned exact, not "^0.2": the langchain-community<0.4 pin below was
# hand-verified against this specific ragas version's import chain
# (ragas/llms/base.py). An unconstrained ^0.2 lets `poetry update`
# silently pick a newer ragas patch whose compatibility with that pin
# has not been checked.
ragas = "0.3.2"
datasets = "^2.20"
# ragas 0.2.x declares no upper bound on langchain-community ("*"), so
# an unconstrained resolution picks the latest available -- which, as
# of langchain-community 0.4.x, dropped the old langchain_community
# .chat_models.vertexai module that ragas/llms/base.py imports
# eagerly at package load, making `import ragas` fail outright. Pin to
# the last pre-split (0.3.x) line, which still has that module.
langchain-community = "<0.4"


# -------------------------------------------------
# Development Dependencies
# Tools used for testing, linting, formatting,
# static analysis, and local development.
# -------------------------------------------------
[tool.poetry.group.dev.dependencies]

# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.15.1"
factory-boy = "^3.3.3"
faker = "^40.35.0"
aiosqlite = "^0.22.1"
types-aiofiles = "^25.1.0.20260518"

# Code quality
ruff = "^0.8.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
types-redis = "^4.6.0"

# Local AWS development tools
aws-sam-cli = { version = "^1.148.0", python = ">=3.10,<3.14" }
awscli = "^1.34.0"


# -------------------------------------------------
# Ruff Configuration
# -------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "build",
  "dist",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


# -------------------------------------------------
# MyPy Configuration
# Static type checking rules.
# -------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Treat src/ as the source/import root.
explicit_package_bases = true
namespace_packages = true
mypy_path = ["src"]
exclude = ["src/.*/__pycache__", "src/__pycache__", ".venv", "venv", "env"]

# Work around missing type stubs for third-party libraries.
[[tool.mypy.overrides]]
module = ["faiss.*", "fitz.*", "sentence_transformers.*"]
ignore_missing_imports = true


# -------------------------------------------------
# Pytest Configuration
# Test discovery, execution, and custom markers.
# -------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = "--strict-markers --tb=short -v -p no:langsmith_plugin"

markers = [
  "unit: Unit tests — no I/O, no DB, no external services",
  "integration: Integration tests — use real services",
  "slow: Tests that take more than 5 seconds",
  "smoke: smoke tests for critical application workflows",
  "e2e: API-level end-to-end tests — real FastAPI app, real Postgres/Redis",
]


# -------------------------------------------------
# Coverage Configuration
# -------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "migrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 30

exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]


# -------------------------------------------------
# Build System
# Backend used to build and manage the project.
# -------------------------------------------------
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
