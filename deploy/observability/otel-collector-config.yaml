receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

      http:
        endpoint: "0.0.0.0:4318"

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  extensions:
    - health_check

  pipelines:
    traces:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - debug
        - otlp/tempo

    metrics:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - prometheus
