# Python logging configuration loaded by setup_logging() in src/core/logger.py
# Override individual settings via environment variables (LOG_LEVEL, LOG_FORMAT, etc.)

version: 1
disable_existing_loggers: false

formatters:
  json:
    class: app.core.logger._JsonFormatter

  text:
    format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    stream: ext://sys.stdout
    formatter: json
    level: DEBUG

  rotating_file:
    class: logging.handlers.RotatingFileHandler
    filename: logs/app.log
    maxBytes: 104857600   # 100 MB
    backupCount: 5
    formatter: json
    level: INFO
    encoding: utf-8

loggers:
  app:
    level: INFO
    handlers: [console, rotating_file]
    propagate: false

  uvicorn:
    level: WARNING
    handlers: [console]
    propagate: false

  sqlalchemy.engine:
    level: WARNING
    handlers: [console]
    propagate: false

  httpx:
    level: WARNING
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
