services:

  # ==========================================================================
  # OpenTelemetry Collector
  # ==========================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: juris_ai_otel_collector
    restart: unless-stopped

    env_file:
      - ../.env

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      # Source-controlled configuration
      - ../infrastructure/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exposed by Collector

    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

    networks:
      - juris_ai_network


  # ==========================================================================
  # Prometheus
  # ==========================================================================

  prometheus:
    image: prom/prometheus:latest-distroless
    container_name: juris_ai_prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    env_file:
      - ../.env

    volumes:
      # Source-controlled configuration
      - ../infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      # Persistent Prometheus TSDB data
      - ./.volumes/prometheus:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - juris_ai_network


  # ==========================================================================
  # Tempo
  # ==========================================================================

  tempo:
    image: grafana/tempo:latest
    container_name: juris_ai_tempo
    restart: unless-stopped

    command:
      - "-config.file=/etc/tempo/tempo.yaml"

    volumes:
      # Source-controlled configuration
      - ../infrastructure/tempo.yaml:/etc/tempo/tempo.yaml:ro

      # Persistent Tempo trace data
      - ./.volumes/tempo:/var/tempo

    ports:
      - "3200:3200"   # Tempo HTTP API

    networks:
      - juris_ai_network


  # ==========================================================================
  # Grafana
  # ==========================================================================

  grafana:
    image: grafana/grafana:latest-distroless-slim
    container_name: juris_ai_grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      # Persistent Grafana state
      - ./.volumes/grafana:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

    networks:
      - juris_ai_network


# ============================================================================
# Shared Docker network
# ============================================================================

networks:
  juris_ai_network:
    external: true
