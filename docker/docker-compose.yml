services:

  redis:
    image: redis:7-alpine
    container_name: legal_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - juris_ai_network

  # FastAPI API service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: juris_ai_api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      DB_HOST: postgres

    env_file:
      - ../.env

    volumes:
      - ../src:/juris_ai/src
      - ../.env:/juris_ai/.env:ro
      - ../alembic.ini:/juris_ai/alembic.ini:ro

    depends_on:
      redis:
        condition: service_healthy

    command: >
      poetry run uvicorn
      src.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /juris_ai/src

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - juris_ai_network


volumes:
  redis_data:

networks:
  juris_ai_network:
    # driver: bridge
    external: true
