services:

  # -----------------------------------------------------
  # Redis — application cache / execution state
  # Accessible inside the network as: redis:6379
  # Accessible from host as:          localhost:6379
  # -----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: juris_ai_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - ./.volumes/redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - juris_ai_network


  # -----------------------------------------------------
  # FastAPI API service
  # Accessible from host as: localhost:8001
  # Accessible inside the network as: api:8000
  # -----------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: juris_ai_api
    restart: unless-stopped

    ports:
      - "8001:8000"

    environment:
      DB_HOST: postgres

    env_file:
      - ../.env

    volumes:
      - ../src:/juris_ai/src
      - ../.env:/juris_ai/.env:ro
      - ../alembic.ini:/juris_ai/alembic.ini:ro

    depends_on:
      redis:
        condition: service_healthy

    command: >
      poetry run uvicorn
      main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /juris_ai/src

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - juris_ai_network


# ============================================================================
# External Network
# ============================================================================
networks:
  juris_ai_network:
    external: true
