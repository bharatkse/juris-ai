codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...100"

  status:
    project:
      default:
        target: auto
        informational: true

    patch:
      default:
        target: 80%
        threshold: 1%
        if_not_found: success
        only_pulls: true
        removed_code_behavior: removals_only

comment:
  layout: "header, diff, flags, tree, footer"
  behavior: default
  require_changes: false
  after_n_builds: 1
