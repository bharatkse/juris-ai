<div
    id="message-list"
    class="flex-1 overflow-y-auto bg-gray-50 px-6 py-6">

    {% if messages %}

        <div class="mx-auto flex max-w-4xl flex-col gap-6">

            {% for message in messages %}

                {% include "components/message.html" %}

            {% endfor %}

        </div>

    {% else %}

        <div
            class="flex h-full items-center justify-center">

            <div class="text-center">

                <h2
                    class="mb-3 text-3xl font-semibold text-gray-800">

                    Juris AI

                </h2>

                <p
                    class="text-gray-500">

                    Ask any legal question to begin your conversation.

                </p>

            </div>

        </div>

    {% endif %}

</div>
