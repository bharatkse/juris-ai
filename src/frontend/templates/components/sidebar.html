<aside
    id="sidebar"
    class="flex w-80 flex-col border-r border-gray-200 bg-white">

    <!-- Header -->
    <div class="border-b border-gray-200 p-4">

        <button
            class="w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-medium text-white transition hover:bg-blue-700"
            hx-post="/ui/conversations"
            hx-target="#sidebar"
            hx-swap="outerHTML">

            + New Conversation

        </button>

    </div>

    <!-- Conversation List -->
    <div class="flex-1 overflow-y-auto">

        {% if conversations %}

            {% for conversation in conversations %}

                {% include "components/conversation_item.html" %}

            {% endfor %}

        {% else %}

            <div class="p-6 text-center text-sm text-gray-500">

                No conversations yet.

            </div>

        {% endif %}

    </div>

</aside>
