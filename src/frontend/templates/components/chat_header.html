<header

    <div class="min-w-0">

        {% if current_conversation %}

            <h1
                class="truncate text-lg font-semibold text-gray-900">

                {{ current_conversation.title }}

            </h1>

        {% else %}

            <h1
                class="text-lg font-semibold text-gray-900">

                New Conversation

            </h1>

    </div>

    {% if current_conversation %}

            <!-- Delete -->

        </div>

    {% endif %}

</header>
