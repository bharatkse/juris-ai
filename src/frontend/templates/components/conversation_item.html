<button
    type="button"
    class="flex w-full items-center justify-between border-b border-gray-100 px-4 py-3 text-left transition hover:bg-gray-100
    {% if active_conversation_id == conversation.id %}
        bg-gray-100
    {% endif %}"

    hx-get="/ui/conversations/{{ conversation.id }}"
    hx-target="#chat-panel"
    hx-swap="innerHTML">

    <div class="min-w-0 flex-1">

        <div
            class="truncate text-sm font-medium text-gray-900">

            {{ conversation.title }}

        </div>

    </div>

</button>
