[pytest]
testpaths       = tests
asyncio_mode    = auto
python_files    = test_*.py
python_classes  = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -v

markers =
    unit: Unit tests — no I/O, no DB, no external services
    integration: Integration tests — use real DB and services
    slow: Tests that take more than 5 seconds
