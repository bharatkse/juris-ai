services:

  db:
    image: postgres:15-alpine
    container_name: juris_ai_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Pass APPlication DB credentials as env vars so init script can read them from .env
      APP_DB_USER: ${DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - juris_ai_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juris-ai-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - .:/src                          # hot reload in dev
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "poetry install --only main --no-interaction &&
               poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - juris_ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: juris-ai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - juris_ai_network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Pulls the LLM model after Ollama is healthy
  # Runs once and exits — won't restart
  ollama-pull:
    image: ollama/ollama:latest
    container_name: juris-ai-ollama-pull
    restart: "no"
    depends_on:
      - ollama
    entrypoint: >
      sh -c "ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - juris_ai_network

  redis:
    image: redis:7-alpine
    container_name: juris-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   # persist to disk
    networks:
      - juris_ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  ollama_data:
  redis_data:

networks:
  juris_ai_network:
    driver: bridge
