# Release bundle. For developing on the backend itself (running
# tests, linting, etc.), see server/CONTRIBUTING.md instead -- that
# flow uses docker/server/docker-compose*.yml.
#
# TEMPORARY: the `api` service below builds from source (this repo)
# rather than pulling a published image, because no image has been
# published to GHCR yet -- .github/workflows/publish-images.yml only
# runs on a version tag push, and none has happened. Once the first
# tag is pushed, swap the `build:` block below for:
#   image: ghcr.io/bharatkse/juris-ai-api:${JURIS_AI_VERSION:-latest}

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: juris_ai_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}

    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
      # Reuses the same first-boot role-creation scripts the dev
      # flow uses -- one source of truth for APP_DB_USER setup.
      - ./docker/server/init/postgres:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - juris_ai_network

  redis:
    image: redis:7-alpine
    container_name: juris_ai_redis
    restart: unless-stopped

    command:
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    volumes:
      - ./.volumes/redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - juris_ai_network

  searxng:
    image: searxng/searxng:latest
    container_name: juris_ai_searxng
    restart: unless-stopped

    volumes:
      - ./docker/server/searxng/settings.yml:/etc/searxng/settings.yml:ro

    environment:
      SEARXNG_BASE_URL: http://searxng:8080/

    healthcheck:
      test: ["CMD", "python3", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - juris_ai_network

  api:
    build:
      context: ./server
      dockerfile: ../docker/server/Dockerfile

    container_name: juris_ai_api
    restart: unless-stopped

    ports:
      - "${API_PORT:-8001}:8000"

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      SEARXNG_BASE_URL: http://searxng:8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - juris_ai_network

networks:
  juris_ai_network:
    driver: bridge
