# CI workflow
# Runs on pushes, pull requests, or when called by another workflow
name: CI

on:
  # Allow this workflow to be reused by other workflows
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to (development, testing, staging, production)"
        required: true
        type: string

  # Run CI on pushes to main development branches
  push:
    branches:
      - main
      - develop

  # Run CI on key pull request lifecycle events
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

# Ensure only one run per branch/workflow is active at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Setup & Configuration
  # ============================================================================

  ci-setup:
    name: CI Setup
    runs-on: ubuntu-latest
    outputs:
      PYTHON_VERSION: ${{ steps.setup-vars.outputs.PYTHON_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup variables
        id: setup-vars
        run: |
          PYTHON_VERSION="3.11.9"
          echo "PYTHON_VERSION=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Python Version: $PYTHON_VERSION"
          echo "✅ Environment: ${{ inputs.environment }}"

  # ============================================================================
  # Configuration File Validation
  # ============================================================================

  # Validate GitHub Actions workflows using Actionlint
  actionlint:
    needs: ci-setup
    name: Lint GitHub Actions
    uses: ./.github/workflows/actionlint.yaml

  # ============================================================================
  # Code Quality & Testing
  # ============================================================================

  code-quality:
    needs: ci-setup
    name: Code Quality Checks
    uses: ./.github/workflows/code-quality.yaml
    with:
      python-version: ${{ needs.ci-setup.outputs.PYTHON_VERSION }}


  # Coverage validation
  codecov-validation:
    name: Coverage Validation
    needs: ci-setup
    uses: ./.github/workflows/codecov-validation.yaml

  # ============================================================================
  # CI Status Summary
  # ============================================================================

  ci-summary:
    name: CI Summary
    needs: [ci-setup, actionlint, code-quality, codecov-validation]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check CI Status
        run: |
          echo "📊 CI Pipeline Summary"
          echo "======================"
          echo ""
          echo "✅ Setup:                    PASSED"
          echo "${{ needs.actionlint.result == 'success' && '✅' || '❌' }} Actionlint:                ${{ needs.actionlint.result }}"
          echo "${{ needs.code-quality.result == 'success' && '✅' || '❌' }} Code Quality:             ${{ needs.code-quality.result }}"
          echo "${{ needs.codecov-validation.result == 'success' && '✅' || '❌' }} Coverage Validation:      ${{ needs.codecov-validation.result }}"
          echo ""

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "❌ CI Pipeline failed - one or more jobs did not pass"
          exit 1

      - name: Success message
        if: success()
        run: |
          echo "✅ All CI checks passed successfully!"
