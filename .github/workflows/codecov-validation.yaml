name: Codecov Config Validation

on:
  workflow_call:

jobs:
  validate-codecov-config:
    name: Validate Codecov Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Codecov configuration exists
        run: |
          if [ ! -f .codecov.yml ]; then
            echo "::error::.codecov.yml not found"
            exit 1
          fi

      - name: Validate Codecov configuration
        run: |
          echo "Validating .codecov.yml..."

          result=$(curl \
            --silent \
            --fail \
            --connect-timeout 10 \
            --max-time 30 \
            --data-binary @.codecov.yml \
            https://codecov.io/validate)

          echo "$result"

          if echo "$result" | grep -q '"status": "error"'; then
            echo "Codecov configuration validation failed!"
            exit 1
          fi

          echo "Codecov configuration is valid."
