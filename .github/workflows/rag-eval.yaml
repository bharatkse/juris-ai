name: RAG Golden Dataset Evaluation

# Not run on every PR: needs a real Postgres+pgvector service (none of
# today's CI jobs use one -- unit tests run against SQLite) and
# downloads the embedding/reranker models from HuggingFace on a cold
# runner, adding real time + an external-network flake risk for a
# small, slow-changing 2-document/29-case dataset. Nightly + on-demand
# catches regressions without taxing every PR.
#
# The gating step evaluates full hybrid retrieval (embeddings + keyword +
# reranker) with the same models as dev/production, and fails if any
# query runs in another mode (e.g. keyword-only because the embedding
# model or its Redis cache is unreachable) instead of measuring the
# fallback. The degraded modes are measured on purpose in two
# non-gating steps. Every step's scores go to the job summary.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}
    working-directory: server

env:
  PYTHON_VERSION: "3.11.9"
  PASS_RATE_THRESHOLD: "65.0"

jobs:
  rag-golden-eval:
    name: Golden Dataset Retrieval Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: juris_ai_user
          POSTGRES_PASSWORD: juris_ai_password
          POSTGRES_DB: juris_ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U juris_ai_user -d juris_ai_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      # Query embeddings go through the Redis-backed cache
      # (CACHE_BACKEND defaults to redis), as in dev and production.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      ENVIRONMENT: development
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: juris_ai_user
      DB_PASSWORD: juris_ai_password
      DB_NAME: juris_ai_db
      # The restricted runtime role the app connects as (required
      # settings; created below before migrations, as in
      # integration-tests.yaml).
      APP_DB_USER: juris_ai_app
      APP_DB_PASSWORD: juris_ai_app_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Optional: authenticates the Hugging Face model downloads (higher
      # rate limits). Empty when the secret isn't set; downloads still
      # work anonymously.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SEARXNG_BASE_URL: "http://localhost"
      # ragas gets imported regardless of faithfulness_backend selection;
      # this is its own sanctioned opt-out for the analytics thread's
      # network flush (see ragas/_analytics.py).
      RAGAS_DO_NOT_TRACK: "true"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          poetry-groups: "--with=dev,eval"
          working-directory: server

      # Same SQL as the local stack's first-boot hook (and `make
      # db-setup-role`). Must run before migrations: it sets the default
      # privileges that give the app role access to tables they create.
      - name: Create restricted app role
        working-directory: .
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          # shellcheck source=/dev/null
          source docker/dependencies/init/postgres/_create_app_role.lib
          ADMIN_ROLE=$DB_USER create_app_role_sql |
            psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"

      # BAAI/bge-small-en-v1.5 (embeddings) and BAAI/bge-reranker-base
      # (reranker): the defaults in rag/embeddings.py and rag/reranker.py,
      # so a model change there invalidates the cache.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('server/src/rag/embeddings.py', 'server/src/rag/reranker.py') }}

      - name: Run database migrations
        env:
          PYTHONPATH: src
        run: poetry run alembic upgrade head

      - name: Ingest golden-dataset corpus
        env:
          PYTHONPATH: src
        run: poetry run python -m rag.ingestion.ingest_offline tests/datasets/rag/raw_datasets

      - name: Evaluate full hybrid retrieval (gating)
        env:
          PYTHONPATH: src
        run: |
          echo "## RAG golden-dataset evaluation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          poetry run python scripts/python/evaluate_rag_retrieval.py \
            --mode full \
            --min-pass-rate "${{ env.PASS_RATE_THRESHOLD }}" \
            --summary "$GITHUB_STEP_SUMMARY"

      # Informational: what users get with the embedding model or the
      # reranker down (review R4). A low score here doesn't fail the job.
      - name: Evaluate keyword-only retrieval (embeddings off, not gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          poetry run python scripts/python/evaluate_rag_retrieval.py \
            --mode keyword_only \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Evaluate retrieval without reranking (reranker off, not gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          poetry run python scripts/python/evaluate_rag_retrieval.py \
            --mode no_rerank \
            --summary "$GITHUB_STEP_SUMMARY"
