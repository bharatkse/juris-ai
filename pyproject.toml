# -------------------------------------------------
# Project metadata (PEP 621)
# -------------------------------------------------
[project]
name = "juris-ai"
version = "0.1.0"
description = "Legal research assistant powered by hybrid RAG"
authors = [{ name = "Bharat Kumar", email = "kumar.bhart28@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]
keywords = ["rag", "legal", "ai", "fastapi", "faiss", "llm"]

# -------------------------------------------------
# Poetry configuration
# -------------------------------------------------
[tool.poetry]
package-mode = false

# -------------------------------------------------
# Root project has NO runtime dependencies
# -------------------------------------------------
[tool.poetry.dependencies]
# Web framework
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }

# password hashing
pwdlib = { extras = ["argon2"], version = "^0.3.0" }

python-multipart = "^0.0.9"
# pdfplumber = "^0.11.0"
# python-docx = "^1.1.0"
# chromadb = "^0.5.0"
# rank-bm25 = "^0.2.2"
# groq = "^0.9.0"


# Validation & configuration
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"

# Database
sqlalchemy = "^2.0.29"
psycopg = { version = "^3.1.19", extras = ["binary"] }

# Database migrations
alembic = "^1.13.1"

#  PDF processing
pymupdf = "^1.24.2"

# Embeddings
# sentence-transformers = "^3.0.0"
# torch = "^2.0.1"                 # local embeddings (all-MiniLM-L6-v2, etc.)
# numpy = "^1.26.4"

#  Vector store
faiss-cpu = "^1.8.0" # swap for faiss-gpu on CUDA hosts

# LLM providers
# openai = "^1.30.1"
# anthropic = "^0.28.0"

# Caching
redis = "^5.0.4" # optional — used only when CACHE_BACKEND=redis

#Async & I/O helpers
aiofiles = "^23.2.1"
httpx = "^0.28.0"    # used by openai/anthropic SDKs

#  AWS (optional — needed only when STORAGE_BACKEND=s3)
boto3 = "^1.34.101"

# -------------------------------------------------
# Dev tooling (shared across repo)
# -------------------------------------------------
asyncpg = "^0.31.0"
groq = "^1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
types-redis = "^4.6.0"

# Local AWS tooling (local only)
localstack = "^3.4.0"
aws-sam-cli = { version = "^1.148.0", python = ">=3.10,<3.14" }
awscli = "^1.34.0"

# -------------------------------------------------
# Ruff (lint + format) — repo-wide
# -------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "build",
  "dist",
  "node_modules",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# -------------------------------------------------
# mypy — repo-wide
# -------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Fix for multiple 'src' modules
explicit_package_bases = true
namespace_packages = true

# Exclude paths to avoid duplicate module conflicts
exclude = ["src/.*/__pycache__", "src/__pycache__", ".venv", "venv", "env"]

[[tool.mypy.overrides]]
module = ["faiss.*", "fitz.*", "sentence_transformers.*"]
ignore_missing_imports = true

# -------------------------------------------------
# pytest — repo-wide
# -------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short -v"
markers = [
  "unit: Unit tests — no I/O",
  "integration: Integration tests — use real services",
  "slow: Tests that take more than 5 seconds",
]

# -------------------------------------------------
# coverage
# -------------------------------------------------
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*", "migrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# -------------------------------------------------
# build system
# -------------------------------------------------
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
